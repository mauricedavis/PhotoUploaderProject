<template>
    <lightning-card title="Photo Uploader" icon-name="utility:upload">
        <div class="drop-zone" ondragover={handleDragOver} ondrop={handleDrop}>
            <template if:true={fileUrl}>
                <img class="preview" src={fileUrl} alt="Current image" />
                <span class="hint">Drop a photo to replace</span>
            </template>

            <template if:false={fileUrl}>
                <div class="empty">
                    <p>Upload Photo</p>
                    <div class="pick">
                        <lightning-button label="Select File" onclick={openPicker}></lightning-button>
                        <span class="or">Or drop files</span>
                    </div>
                </div>
            </template>

            <input
                class="hidden-input"
                type="file"
                accept={acceptString}
                onchange={handleFilePicked}
            />
        </div>
    </lightning-card>
</template>
