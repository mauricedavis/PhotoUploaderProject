<template>
  <lightning-card title="Photo Uploader" icon-name="utility:upload">
    <div class="wrap">
      <!-- IMAGE + DROP ZONE -->
      <template if:true={fileUrl}>
        <div class="imgBox"
             ondragover={handleDragOver}
             ondragenter={handleDragEnter}
             ondragleave={handleDragLeave}
             ondrop={handleDrop}>
          <img src={fileUrl} alt="Photo" class="uploaded-img"/>

          <!-- Visual cue while dragging -->
          <template if:true={isDragging}>
            <div class="dropMask">Drop to replace</div>
          </template>

          <div class="hint">Drop a photo to replace</div>
        </div>
      </template>

      <!-- INITIAL UPLOAD (no image yet) -->
      <template if:false={fileUrl}>
        <div class="uploader">
          <lightning-file-upload
            label="Upload Photo"
            name="fileUploader"
            accept={acceptedFormats}
            multiple={allowMultiple}
            record-id={recordId}
            onuploadfinished={handleUploadFinished}>
          </lightning-file-upload>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
