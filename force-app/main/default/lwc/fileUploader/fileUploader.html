<template>
  <div class="uploader">
    <lightning-card title="Photo Uploader">
      <div class="slds-p-around_medium">
        <lightning-input type="file"
                         label="Upload Photo"
                         accept=".jpg,.jpeg,.png,.heic,.pdf"
                         onchange={onPick}>
        </lightning-input>
        <div class="slds-m-top_small slds-text-color_weak">
          Max size: {maxMb} MB
        </div>
      </div>
    </lightning-card>
  </div>
</template>
