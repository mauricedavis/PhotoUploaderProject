<template>
    <div class="frame" ondragover={handleDragOver} ondrop={handleDrop}>
        <div class="header">Photo Uploader</div>

        <template if:true={hasImage}>
            <img class="photo" src={fileUrl} alt="record photo"/>
            <span class="hint">Drop a photo to replace</span>
        </template>

        <template if:false={hasImage}>
            <div class="empty">Upload Photo</div>
        </template>

        <div class="actions">
            <input class="picker" type="file" accept={acceptAttr} onchange={handleFilePicked}/>
            <button class="btn" onclick={clickPicker}>Upload Files</button>
            <span class="dropcopy">Or drop files</span>
        </div>
    </div>
</template>
