<template>
    <lightning-card title="Photo Uploader" icon-name="utility:upload">
        <!-- Show image if we have one -->
        <template if:true={fileUrl}>
            <div class="frame">
                <img class="photo" src={fileUrl} alt="Record photo"/>

                <!-- Drop zone overlay (heic only) -->
                <div class="dropZone"
                     ondragover={handleDragOver}
                     ondrop={handleDrop}>
                    Drop a HEIC photo to replace
                </div>
            </div>
        </template>

        <!-- Else show uploader -->
        <template if:false={fileUrl}>
            <div class="uploader">
                <lightning-file-upload
                    label="Upload Photo"
                    name="fileUploader"
                    accept={acceptedFormats}
                    record-id={recordId}
                    multiple={allowMultiple}
                    onuploadfinished={handleUploadFinished}>
                </lightning-file-upload>

                <!-- also support drag/drop when no current photo -->
                <div class="dropHint"
                     ondragover={handleDragOver}
                     ondrop={handleDrop}>
                    or drop a HEIC file here
                </div>
            </div>
        </template>
    </lightning-card>
</template>
