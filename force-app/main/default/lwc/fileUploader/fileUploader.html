<template>
    <lightning-card title="Photo Uploader" icon-name="utility:upload">
        <!-- When a file is already selected/displayed -->
        <template if:true={fileUrl}>
            <div class="canvas" ondragover={handleDragOver} ondrop={handleDrop}>
                <template if:true={isPdf}>
                    <iframe class="doc-frame" src={fileUrl} title="PDF document"></iframe>
                </template>
                <template if:false={isPdf}>
                    <img class="image" src={fileUrl} alt="Uploaded image"/>
                </template>
                <div class="hint">Drop a photo to replace</div>
            </div>
        </template>

        <!-- When nothing selected -->
        <template if:false={fileUrl}>
            <div class="uploader">
                <label class="btn">
                    Upload Photo
                    <input class="hidden-file"
                           type="file"
                           accept=".jpg,.jpeg,.png,.heic,.pdf"
                           onchange={handleFilePick}/>
                </label>
                <span class="or">Or drop files</span>
                <div class="dropzone" ondragover={handleDragOver} ondrop={handleDrop}></div>
            </div>
        </template>
    </lightning-card>
</template>
