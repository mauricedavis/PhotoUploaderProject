<template>
    <lightning-card title="Photo Uploader" icon-name="utility:upload">
        <template if:true={fileUrl}>
            <div class="slds-align_absolute-center slds-p-around_medium">
                <img src={fileUrl} class="uploaded-img" alt="Uploaded Image" style="max-height:300px; border-radius:8px;" />
            </div>
        </template>

        <template if:false={fileUrl}>
            <div class="slds-p-around_medium">
                <lightning-file-upload
                    label="Upload Photo"
                    name="fileUploader"
                    accept={acceptedFormats}
                    record-id={recordId}
                    onuploadfinished={handleUploadFinished}
                    multiple={allowMultiple}
                ></lightning-file-upload>
            </div>
        </template>
    </lightning-card>
</template>
