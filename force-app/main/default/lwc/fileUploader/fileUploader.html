<template>
  <lightning-card title="Photo Uploader" icon-name="utility:upload">
    <!-- Show image with invisible overlay-uploader on top for drop/click replace -->
    <template if:true={fileUrl}>
      <div class="img-wrap">
        <img src={fileUrl} class="uploaded-img" alt="Uploaded photo" />
        <div class="hint">Drop a photo to replace</div>
        <lightning-file-upload
          class="overlay-uploader"
          record-id={recordId}
          accept={acceptedFormats}
          multiple={allowMultiple}
          onuploadfinished={handleUploadFinished}>
        </lightning-file-upload>
      </div>
    </template>

    <!-- No image: show standard uploader -->
    <template if:false={fileUrl}>
      <div class="uploader-slot">
        <lightning-file-upload
          label="Upload Photo"
          name="fileUploader"
          accept={acceptedFormats}
          record-id={recordId}
          onuploadfinished={handleUploadFinished}
          multiple={allowMultiple}>
        </lightning-file-upload>
      </div>
    </template>
  </lightning-card>
</template>
