<template>
  <lightning-card title="Photo Uploader" icon-name="utility:upload">
    <div class="frame"
         ondragover={onDragOver}
         ondragleave={onDragLeave}
         ondrop={onDrop}
         onclick={openPicker}>

      <template if:true={fileUrl}>
        <img class="hero" src={fileUrl} alt="Current photo"/>
      </template>

      <template if:false={fileUrl}>
        <div class="placeholder">
          Click or drop an image to upload
        </div>
      </template>

      <input class="picker" type="file" accept="image/*" onchange={onPickChange}/>
      <div class="hint">Drop a photo to replace</div>
    </div>
  </lightning-card>
</template>
