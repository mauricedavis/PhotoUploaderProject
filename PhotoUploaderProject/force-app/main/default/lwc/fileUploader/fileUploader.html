<template>
    <div class="slds-box slds-theme_default">
        <template if:true={photoUrl}>
            <img src={photoUrl} alt="Uploaded Image" style="max-width: 100%; border-radius: 0.5rem;" />
            <p class="slds-m-top_small slds-text-align_center">Picture uploaded</p>
            <div class="slds-text-align_center slds-m-top_small">
                <lightning-button label="Delete Photo" icon-name="utility:delete" onclick={handleDelete}></lightning-button>
            </div>
        </template>
        <template if:false={photoUrl}>
            <lightning-file-upload
                label="Upload Photo"
                name="fileUploader"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>
        </template>
    </div>
</template>
